<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --width: 760px;
    --font-main: 'Shippori Mincho', 'Noto Sans JP', serif;
    --font-secondary: 'Noto Sans JP', sans-serif;
    --background-color: #ffffff;
    --heading-color: #222222;
    --text-color: #333333;
    --muted-color: #767676;
    --link-color: #bf6a4d;
    --visited-color: #9c5239;
    --blockquote-color: #6b6b6b;
    --accent-color: #bf6a4d;
    --accent-soft: #f3e0d7;
    --border-color: #e8e4e0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #1c1a18;
      --heading-color: #f1ece7;
      --text-color: #ddd6cf;
      --muted-color: #a89e94;
      --link-color: #e0876a;
      --visited-color: #cf7857;
      --blockquote-color: #a89e94;
      --accent-color: #e0876a;
      --accent-soft: #3a2e28;
      --border-color: #3a332c;
    }
  }

  body {
    background: var(--background-color);
  }

  /* masthead */
  header {
    text-align: center;
    padding: 44px 0 22px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 36px;
  }

  .site-brand {
    text-decoration: none !important;
  }

  .site-title {
    font-family: var(--font-main);
    font-weight: 700;
    font-size: 2em;
    letter-spacing: 0.1em;
    color: var(--heading-color);
    margin: 0;
  }

  .site-tagline {
    color: var(--muted-color);
    font-size: 0.9em;
    margin: 10px 0 22px;
  }

  nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 28px;
  }

  nav a {
    display: inline-block;
    color: var(--text-color);
    font-size: 0.92em;
    font-weight: 500;
    padding: 0 0 3px;
    margin: 0;
    border-bottom: 1px solid transparent;
  }

  nav a:hover {
    color: var(--accent-color);
    border-bottom-color: var(--accent-color);
    text-decoration: none;
  }

  /* headings inside the page body get a terracotta rule */
  h1, h2, h3 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  main h2 {
    font-size: 1.4em;
    margin-top: 2.4em;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--accent-color);
  }

  main h3 {
    font-size: 1.15em;
    margin-top: 1.8em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--accent-color);
  }

  a {
    color: var(--link-color);
  }

  a:visited {
    color: var(--visited-color);
  }

  /* article headline */
  .post-eyebrow {
    color: var(--muted-color);
    font-size: 0.85em;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .post-category {
    color: var(--accent-color);
    margin-left: 10px;
    font-weight: 500;
  }

  .post-title-main {
    font-size: 1.9em;
    line-height: 1.4;
    margin: 0 0 1em;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--accent-color);
  }

  /* category list */
  ul.category-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    list-style: none;
    padding: 0;
    margin: 18px 0 8px;
  }

  ul.category-list li a {
    display: inline-block;
    border: 1px solid var(--accent-color);
    color: var(--accent-color);
    padding: 6px 16px;
    font-size: 0.9em;
    border-radius: 2px;
  }

  ul.category-list li a:hover {
    background: var(--accent-color);
    color: #fff;
    text-decoration: none;
  }

  /* post list (home / section / category term pages) */
  ul.blog-posts {
    list-style: none;
    padding: 0;
    margin: 16px 0;
  }

  ul.blog-posts li.post-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border-color);
  }

  .post-title {
    color: var(--heading-color);
    font-weight: 500;
    font-size: 1.05em;
  }

  .post-title:hover {
    color: var(--accent-color);
  }

  ul.blog-posts li.post-row time {
    font-family: var(--font-secondary);
    color: var(--muted-color);
    font-size: 0.85em;
    white-space: nowrap;
  }

  .filter-clear a {
    font-size: 0.9em;
    color: var(--muted-color);
  }

  .tag-cloud {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag-pill {
    color: var(--muted-color);
    font-size: 0.82em;
  }

  .tag-pill:hover {
    color: var(--accent-color);
    text-decoration: none;
  }

  footer {
    color: var(--muted-color);
    border-top: 1px solid var(--border-color);
    margin-top: 44px;
  }
</style>
