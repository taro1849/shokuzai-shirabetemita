<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --width: 760px;
    --font-main: 'Shippori Mincho', 'Noto Sans JP', serif;
    --font-secondary: 'Noto Sans JP', sans-serif;
    --background-color: #ffffff;
    --heading-color: #222222;
    --text-color: #333333;
    --muted-color: #767676;
    --link-color: #bf6a4d;
    --visited-color: #9c5239;
    --blockquote-color: #6b6b6b;
    --accent-color: #bf6a4d;
    --accent-soft: #f3e0d7;
    --border-color: #e8e4e0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #1c1a18;
      --heading-color: #f1ece7;
      --text-color: #ddd6cf;
      --muted-color: #a89e94;
      --link-color: #e0876a;
      --visited-color: #cf7857;
      --blockquote-color: #a89e94;
      --accent-color: #e0876a;
      --accent-soft: #3a2e28;
      --border-color: #3a332c;
    }
  }

  body {
    background: var(--background-color);
    overflow-x: hidden;
  }

  /* masthead */
  header {
    text-align: center;
    padding: 44px 0 22px;
  }

  /* full-bleed hero banner (home page) */
  .hero-banner {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    margin-bottom: 40px;
    max-height: 380px;
    overflow: hidden;
    border-top: 1px solid var(--border-color);
    border-bottom: 4px solid var(--accent-color);
  }

  .hero-banner img {
    width: 100%;
    height: 100%;
    max-height: 380px;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 600px) {
    .hero-banner,
    .hero-banner img {
      max-height: 220px;
    }
  }

  .site-brand {
    text-decoration: none !important;
  }

  .site-title {
    font-family: var(--font-main);
    font-weight: 700;
    font-size: 2em;
    letter-spacing: 0.1em;
    color: var(--heading-color);
    margin: 0;
  }

  .site-tagline {
    color: var(--muted-color);
    font-size: 0.9em;
    margin: 10px 0 22px;
  }

  nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 28px;
  }

  nav a {
    display: inline-block;
    color: var(--text-color);
    font-size: 0.92em;
    font-weight: 500;
    padding: 0 0 3px;
    margin: 0;
    border-bottom: 1px solid transparent;
  }

  nav a:hover {
    color: var(--accent-color);
    border-bottom-color: var(--accent-color);
    text-decoration: none;
  }

  /* category dropdown in nav */
  .nav-dropdown {
    position: relative;
  }

  .nav-dropdown-toggle {
    display: inline-block;
    color: var(--text-color);
    font-size: 0.92em;
    font-weight: 500;
    cursor: pointer;
    padding: 0 0 3px;
    border-bottom: 1px solid transparent;
  }

  .nav-dropdown:hover .nav-dropdown-toggle {
    color: var(--accent-color);
    border-bottom-color: var(--accent-color);
  }

  .nav-dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--background-color);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px 0;
    min-width: 170px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    z-index: 20;
  }

  .nav-dropdown:hover .nav-dropdown-menu {
    display: block;
  }

  .nav-dropdown-menu a {
    display: block;
    padding: 8px 18px;
    color: var(--text-color);
    font-size: 0.9em;
    font-weight: 400;
    white-space: nowrap;
    border-bottom: none;
  }

  .nav-dropdown-menu a:hover {
    background: var(--accent-soft);
    color: var(--accent-color);
    text-decoration: none;
  }

  /* article table of contents */
  .post-toc {
    background: var(--accent-soft);
    border-left: 4px solid var(--accent-color);
    border-radius: 4px;
    padding: 18px 22px;
    margin: 24px 0 36px;
  }

  .post-toc-title {
    font-weight: 700;
    color: var(--heading-color);
    margin: 0 0 10px;
    font-size: 0.95em;
  }

  .post-toc nav#TableOfContents ul,
  .post-toc ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .post-toc li {
    padding: 7px 0;
    border-bottom: 1px solid var(--border-color);
  }

  .post-toc li:last-child {
    border-bottom: none;
  }

  .post-toc a {
    color: var(--text-color);
    font-size: 0.95em;
  }

  .post-toc a:hover {
    color: var(--accent-color);
  }

  /* headings inside the page body get a terracotta rule */
  h1, h2, h3 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  main h2 {
    font-size: 1.4em;
    margin-top: 2.4em;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--accent-color);
  }

  main h3 {
    font-size: 1.15em;
    margin-top: 1.8em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--accent-color);
  }

  a {
    color: var(--link-color);
  }

  a:visited {
    color: var(--visited-color);
  }

  /* article headline */
  .post-eyebrow {
    color: var(--muted-color);
    font-size: 0.85em;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .post-category {
    color: var(--accent-color);
    margin-left: 10px;
    font-weight: 500;
  }

  .post-title-main {
    font-size: 1.9em;
    line-height: 1.4;
    margin: 0 0 1em;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--accent-color);
  }

  /* category list */
  ul.category-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    list-style: none;
    padding: 0;
    margin: 18px 0 8px;
  }

  ul.category-list li a {
    display: inline-block;
    border: 1px solid var(--accent-color);
    color: var(--accent-color);
    padding: 6px 16px;
    font-size: 0.9em;
    border-radius: 2px;
  }

  ul.category-list li a:hover {
    background: var(--accent-color);
    color: #fff;
    text-decoration: none;
  }

  /* post grid (home / section / category term pages) */
  ul.post-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 28px 24px;
    list-style: none;
    padding: 0;
    margin: 16px 0;
  }

  .post-card-link {
    display: block;
    color: inherit;
    text-decoration: none !important;
  }

  .post-card-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    margin-bottom: 10px;
    background: var(--accent-soft);
  }

  .post-card-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .post-card-category {
    color: var(--accent-color);
    font-size: 0.78em;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .post-card-title {
    color: var(--heading-color);
    font-weight: 700;
    font-size: 1em;
    line-height: 1.5;
  }

  .post-card-link:hover .post-card-title {
    color: var(--accent-color);
  }

  .post-card-body time {
    font-family: var(--font-secondary);
    color: var(--muted-color);
    font-size: 0.82em;
  }

  .filter-clear a {
    font-size: 0.9em;
    color: var(--muted-color);
  }

  .tag-cloud {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag-pill {
    color: var(--muted-color);
    font-size: 0.82em;
  }

  .tag-pill:hover {
    color: var(--accent-color);
    text-decoration: none;
  }

  footer {
    color: var(--muted-color);
    border-top: 1px solid var(--border-color);
    margin-top: 44px;
  }
</style>
